<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Communique Events</title>
    <link rel="manifest" href="site.webmanifest">
    <link rel="shortcut icon" type="image/x-icon" href="assets/img/favicon.ico">
    <!-- CSS here -->
    <link rel="stylesheet" href="assets/css/events.css">
    <link rel="stylesheet" href="assets/css/upcomingevents.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/aos/2.3.4/aos.js"></script>
</head>
<body>
    <header>
        <h1>Welcome to Communique Events</h1>
        <p>Your gateway to the most exciting events of the year!</p>
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="photography.html">Achievements</a>
            <a href="contributors.html">Contributors</a>
            <a href="upcomingevents.html">Upcoming Events</a>
        </nav>
    </header>

    <section id="events" class="timeline-section">
        <div class="timeline-header">
            <h2 class="section-title">Events Timeline</h2>
            <p class="section-subtitle">Upcoming events you won't want to miss!</p>
        </div>
        <div class="timeline" id="timeline"></div>
    </section>

    <section class="gallery">
        <h2>Event Highlights</h2>
        <div class="gallery-scroll">
            <div class="gallery-container" id="gallery"></div>
        </div>
    </section>

    <footer>
        Copyright ©2024 | <a href="#">All Rights Reserved.</a>
    </footer>

    <script>
        const events = [
            {
                date: "December 18-20, 2024",
                title: "IETE X Communique",
                description: "Soaring into innovation, our branch's drone workshop unlocked the skies of creativity and technology for aspiring minds!",
                images: [
                    "assets/img/drone1.jpg",
                    "assets/img/drone2.jpg",
                    "assets/img/drone3.jpg"
                ]
            },
            {
                date: "October 03-06, 2024",
                title: "ECPL'24",
                description: "Beyond Boundaries: The Ultimate Cricket Showdown!",
                images: [
                    "assets/img/ecpl241.JPG",
                    "assets/img/ecpl242.JPG",
                    "assets/img/ecpl243.JPG"
                ]
            },
            {
                date: "November 04, 2023",
                title: "TRADITIONAL DAY",
                description: "Our branch celebrated Traditional Day with vibrant attire, cultural performances, and a beautiful blend of heritage and unity, making it a day to cherish our roots.",
                images: [
                    "assets/img/traditional1.JPG",
                    "assets/img/traditional2.JPG",
                    "assets/img/traditional3.JPG"
                ]
            },
            {
                date: "October 06-09, 2023",
                title: "ECPL'23",
                description: "ECPL: Where passion meets precision, and the spirit of cricket unites the champions of ECE!",
                images: [
                    "assets/img/ecpl231.JPG",
                    "assets/img/ecpl232.JPG",
                    "assets/img/ecpl234.jpg"
                ]
            },
            {
                date: "February 09, 2023",
                title: "EKATRA'23",
                description: "A vibrant celebration of diversity and talent, Ekatra brought our branch together in a symphony of traditions, colors, and creativity.",
                images: [
                    "assets/img/ekatra231.jpg",
                    "assets/img/ekatra232.jpg",
                    "assets/img/ekatra233.jpg"
                ]
            }
        ];

        function renderTimeline() {
            const timeline = document.getElementById("timeline");

            events.forEach((event, index) => {
                const timelineItem = document.createElement("div");
                timelineItem.classList.add("timeline-item");
                timelineItem.innerHTML = `
                    <p class="timeline-date">${event.date}</p>
                    <h2 class="timeline-title">${event.title}</h2>
                    <p class="timeline-description">${event.description}</p>
                    <div class="event-images" id="event-images-${index}"></div>
                `;

                timelineItem.addEventListener("click", () => {
                    const eventImages = document.getElementById(`event-images-${index}`);
                    eventImages.innerHTML = "";

                    event.images.forEach(imageUrl => {
                        const imageDiv = document.createElement("div");
                        imageDiv.classList.add("event-image");
                        imageDiv.style.backgroundImage = `url(${imageUrl})`;
                        eventImages.appendChild(imageDiv);
                    });

                    eventImages.classList.toggle("visible");
                });

                timeline.appendChild(timelineItem);

                setTimeout(() => {
                    timelineItem.classList.add("appear");
                }, index * 300);
            });
        }

        function renderGallery() {
            const gallery = document.getElementById("gallery");
            gallery.innerHTML = "";

            events.forEach(event => {
                event.images.forEach(imageUrl => {
                    const imageDiv = document.createElement("div");
                    imageDiv.classList.add("gallery-image");

                    const img = new Image();
                    img.onload = () => {
                        imageDiv.style.backgroundImage = `url(${imageUrl})`;

                        const infoDiv = document.createElement("div");
                        infoDiv.classList.add("gallery-info");
                        infoDiv.textContent = `${event.title} - ${event.date}`;

                        imageDiv.appendChild(infoDiv);
                        gallery.appendChild(imageDiv);
                    };
                    img.onerror = () => {
                        imageDiv.style.backgroundImage = `url('assets/images/placeholder.png')`;

                        const infoDiv = document.createElement("div");
                        infoDiv.classList.add("gallery-info");
                        infoDiv.textContent = `${event.title} - ${event.date}`;

                        imageDiv.appendChild(infoDiv);
                        gallery.appendChild(imageDiv);
                    };

                    img.src = imageUrl;
                });
            });
        }

        document.addEventListener("DOMContentLoaded", () => {
            renderTimeline();
            renderGallery();
        });
    </script>
    <script>
        document.addEventListener("DOMContentLoaded", function () {
            AOS.init({
                once: false, // Animations will repeat if the element is scrolled back into view
            });
        });
    </script>
</body>
</html>
