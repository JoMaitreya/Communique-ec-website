        function renderTimeline() {
            const timeline = document.getElementById("timeline");

            events.forEach((event, index) => {
                const timelineItem = document.createElement("div");
                timelineItem.classList.add("timeline-item");
                timelineItem.innerHTML = `
                    <p class="timeline-date">${event.date}</p>
                    <h2 class="timeline-title">${event.title}</h2>
                    <p class="timeline-description">${event.description}</p>
                    <div class="event-images" id="event-images-${index}"></div>
                `;

                timelineItem.addEventListener("click", () => {
                    const eventImages = document.getElementById(`event-images-${index}`);
                    eventImages.innerHTML = "";

                    event.images.forEach(imageUrl => {
                        const imageDiv = document.createElement("div");
                        imageDiv.classList.add("event-image");
                        imageDiv.style.backgroundImage = `url(${imageUrl})`;
                        eventImages.appendChild(imageDiv);
                    });

                    eventImages.classList.toggle("visible");
                });

                timeline.appendChild(timelineItem);

                setTimeout(() => {
                    timelineItem.classList.add("appear");
                }, index * 300);
            });
        }

        function renderGallery() {
    const gallery = document.getElementById("gallery");
    gallery.innerHTML = "";

    events.forEach(event => {
        event.images.forEach(imageUrl => {
            const imageDiv = document.createElement("div");
            imageDiv.classList.add("gallery-image");
            imageDiv.style.backgroundImage = `url(${imageUrl})`;

            const infoDiv = document.createElement("div");
            infoDiv.classList.add("gallery-info");
            infoDiv.textContent = `${event.title} - ${event.date}`;

            imageDiv.appendChild(infoDiv);
            gallery.appendChild(imageDiv);
        });
    });
}


        document.addEventListener("DOMContentLoaded", () => {
            renderTimeline();
            renderGallery();
